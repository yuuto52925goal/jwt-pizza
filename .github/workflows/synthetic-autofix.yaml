name: Synthetic Autofix

# Started by synthetic.yaml after a rollback, or by hand from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      issue:
        description: Incident issue number
        required: true
      bad_sha:
        description: Commit that failed synthetic tests
        required: true
      good_tag:
        description: Last known-good release tag
        required: true
      debug:
        description: Print the full agent transcript to the log (secrets are masked)
        type: boolean
        default: false
        required: true

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # main, so the fix branch sits on top of the latest code

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - run: |
          npm ci
          npx playwright install --with-deps chromium

      - uses: anthropics/claude-code-action@v1
        env:
          SYNTHETIC_EMAIL: ${{ secrets.SYNTHETIC_EMAIL }}
          SYNTHETIC_PASSWORD: ${{ secrets.SYNTHETIC_PASSWORD }}
        with:
          # whichever one /install-github-app set up
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: github-actions # synthetic.yaml dispatches this run as the github-actions bot
          display_report: true # show what the agent did in the run's Step Summary
          show_full_output: ${{ inputs.debug }}
          # Least privilege: only the commands the job needs. The only push allowed is this incident's autofix branch.
          claude_args: >-
            --max-turns 30
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(bash synthetic/run-local.sh),Bash(npx playwright test),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git switch:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push -u origin autofix/issue-${{ inputs.issue }}),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh pr create:*)"
          prompt: |
            Production synthetic tests failed for commit ${{ inputs.bad_sha }} and the frontend was
            automatically rolled back to ${{ inputs.good_tag }}.
            Incident: issue #${{ inputs.issue }} in ${{ github.repository }} (read it with `gh issue view`).

            Rules for tools: run ONE command per Bash call (no &&, ;, pipes, or VAR=value prefixes),
            and change files with the Edit tool, not sed.

            1. Find the cause: `git diff ${{ inputs.good_tag }} ${{ inputs.bad_sha }} -- src tests`.
            2. Reproduce against the REAL backend, not mocks: `bash synthetic/run-local.sh`.
            3. Fix it on a new branch: `git switch -c autofix/issue-${{ inputs.issue }}`. Verify with
               `bash synthetic/run-local.sh` AND `npx playwright test` (both must pass).
            4. If verified: commit, `git push -u origin autofix/issue-${{ inputs.issue }}`, then `gh pr create`
               with `--base main`, a body that says `Fixes #${{ inputs.issue }}` and explains root cause + evidence,
               and `--reviewer ${{ github.repository_owner }}`.
            5. If you are NOT confident, do not open a PR. Comment your findings on the issue instead.
            Never merge, never push to main, never edit synthetic/ tests to make them pass.
